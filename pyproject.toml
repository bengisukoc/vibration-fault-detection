[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibration-fault-detection"
version = "0.1.0"
description = "FFT and envelope analysis for simulated rotating-machinery faults"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8,<4", "numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

